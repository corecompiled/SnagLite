version: 2

updates:
  # .NET CLI — versions live in /Directory.Packages.props
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # Android — versions live in /android/gradle/libs.versions.toml
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Dependabot assigns a dependency to the FIRST group whose pattern matches,
    # not to every group it matches. `compose` must therefore come before
    # `androidx` — the other way round, "androidx.*" swallows every Compose
    # artifact and the compose group never receives a member.
    groups:
      compose:
        patterns:
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
    ignore:
      # Upgrading the download engine changes download behaviour, not build
      # plumbing. It needs the manual URL matrix in PRIVATE_NOTES.local.md,
      # so it does not belong in an automated PR.
      - dependency-name: "io.github.junkfood02.youtubedl-android:*"
      # AGP 9 is deliberately not adopted: it removes the kotlin.android plugin
      # and turns on R8 strict full mode for keep rules, which needs its own
      # migration (see CLAUDE.md, Toolchain versions). Gradle 9 travels with it.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # Pinned until the project moves to compileSdk 37 / AGP 9 — remove then.
      # core-ktx 1.18 needs compileSdk 36.1, 1.19 needs 37 + AGP 9.1;
      # lifecycle 2.11 needs 37 + AGP 9.2; work 2.11+ is the same androidx
      # generation and stays on 2.10 to match lifecycle (see CLAUDE.md).
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.18.0"]
      - dependency-name: "androidx.lifecycle:*"
        versions: [">= 2.11.0"]
      - dependency-name: "androidx.work:*"
        versions: [">= 2.11.0"]
      # Coil 3.5+ is built with Kotlin 2.4, whose stdlib metadata the project's
      # Kotlin 2.3.20 compiler cannot read. Remove when Kotlin moves to 2.4.
      - dependency-name: "io.coil-kt.coil3:*"
        versions: [">= 3.5.0"]
      # These versions' AAR metadata require compileSdk 37 (checkDebugAarMetadata
      # fails on 36). Remove with the compileSdk 37 move.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2026.08.00"]
      - dependency-name: "com.squareup.okhttp3:*"
        versions: [">= 5.5.0"]

  # Workflow actions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
