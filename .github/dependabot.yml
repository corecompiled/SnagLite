version: 2

updates:
  # .NET CLI — versions live in /Directory.Packages.props
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # Android — versions live in /android/gradle/libs.versions.toml
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Dependabot assigns a dependency to the FIRST group whose pattern matches,
    # not to every group it matches. `compose` must therefore come before
    # `androidx` — the other way round, "androidx.*" swallows every Compose
    # artifact and the compose group never receives a member.
    groups:
      compose:
        patterns:
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
    ignore:
      # Upgrading the download engine changes download behaviour, not build
      # plumbing. It needs the manual URL matrix in PRIVATE_NOTES.local.md,
      # so it does not belong in an automated PR.
      - dependency-name: "io.github.junkfood02.youtubedl-android:*"
      # AGP 9 is deliberately not adopted: it removes the kotlin.android plugin
      # and turns on R8 strict full mode for keep rules, which needs its own
      # migration (see CLAUDE.md, Toolchain versions). Gradle 9 travels with it.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]

  # Workflow actions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
